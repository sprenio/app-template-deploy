services:
  # --------------------------------------------------
  # Shared infrastructure
  # --------------------------------------------------

  db:
    image: mariadb:13.0.2-ubi10
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - ${DB_DATA_DIR:?DB_DATA_DIR is required}:/var/lib/mysql
      - ${DB_LOGS_DIR:?DB_LOGS_DIR is required}:/var/log/mysql
      - ./db/00_create_db_changes.sql:/docker-entrypoint-initdb.d/00_create_db_changes.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb -h localhost -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD" -e "USE $$MYSQL_DATABASE;"
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      app-internal:
        aliases:
          - db
      db-admin:
        aliases:
          - ${APP_SLUG:?APP_SLUG is required}-db

  rabbitmq:
    image: rabbitmq:4.1.2-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - ${RABBITMQ_DATA_DIR:?RABBITMQ_DATA_DIR is required}:/var/lib/rabbitmq
      - ${RABBITMQ_LOGS_DIR:?RABBITMQ_LOGS_DIR is required}:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - app-internal

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    volumes:
      - ${REDIS_DATA_DIR:?REDIS_DATA_DIR is required}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-internal

  # --------------------------------------------------
  # Database migrations (one-shot)
  # --------------------------------------------------

  db-migrator:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-db-migrator:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: "no"
    environment:
      MYSQL_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-internal
    profiles:
      - deploy

  # --------------------------------------------------
  # Backend Blue / Green
  # --------------------------------------------------

  backend-blue:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-backend-webserver:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    env_file:
      - .env
    environment: &backend-env
      APP_ENV: prod
      APP_NAME: ${APP_NAME}
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
      DB_NAME: ${DB_DATABASE}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-internal
    profiles:
      - blue

  backend-green:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-backend-webserver:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-internal
    profiles:
      - green

  # --------------------------------------------------
  # Frontend Blue / Green
  # --------------------------------------------------

  frontend-blue:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    volumes:
      - ./nginx/frontend-blue.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NGINX_LOGS_DIR:?NGINX_LOGS_DIR is required}:/var/log/nginx
    depends_on:
      - backend-blue
    networks:
      - app-internal
    profiles:
      - blue

  frontend-green:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    volumes:
      - ./nginx/frontend-green.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NGINX_LOGS_DIR:?NGINX_LOGS_DIR is required}:/var/log/nginx
    depends_on:
      - backend-green
    networks:
      - app-internal
    profiles:
      - green

  # --------------------------------------------------
  # Stable router
  # --------------------------------------------------

  router:
    image: nginx:1.29.0-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/router-active:/etc/nginx/conf.d:ro
    networks:
      app-internal: {}
      reverse-proxy:
        aliases:
          - ${APP_SLUG:?APP_SLUG is required}-frontend

  # --------------------------------------------------
  # Singleton workers
  # --------------------------------------------------

  consumer:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-backend-consumer:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    env_file:
      - .env
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-internal

  cron:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-backend-cron:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    env_file:
      - .env
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-internal

networks:
  app-internal:
    driver: bridge

  reverse-proxy:
    external: true

  db-admin:
    external: true